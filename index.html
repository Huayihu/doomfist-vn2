<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>心动之箭：末日铁拳</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:," />
</head>

<body>
  <div id="app" class="app">
    <!-- 背景层 -->
    <div id="bg" class="bg" aria-hidden="true"></div>

    <!-- 立绘层 -->
    <div class="char-layer" aria-hidden="true">
      <img id="charImg" class="char-img" src="assets/charA.png" alt="">
    </div>

    <!-- 顶部HUD -->
    <div class="hud">
      <button id="btnChat" class="hud-btn">聊天</button>

      <button id="btnMail" class="hud-btn">
        信件 <span id="mailBadge" class="badge hidden">0</span>
      </button>

      <button id="btnReset" class="hud-btn ghost">RESET</button>
    </div>

    <!-- 左下角好感度 -->
    <div class="affection">
      <div class="heart">❤</div>
      <div class="aff-body">
        <div class="aff-label">好感度 <span id="affValue">0</span></div>
        <div class="aff-bar">
          <div id="affFill" class="aff-fill"></div>
        </div>
      </div>
    </div>

    <!-- 邮件面板 -->
    <div id="mailPanel" class="panel hidden" role="dialog" aria-label="信件面板">
      <div class="panel-header">
        <div class="panel-title">信件</div>
        <button id="mailClose" class="panel-close">×</button>
      </div>
      <div id="mailList" class="mail-list"></div>
      <div id="mailEmpty" class="mail-empty hidden">暂无信件（剧情推进会解锁）</div>
    </div>

    <!-- 对话框 -->
    <div id="textbox" class="textbox">
      <div class="tb-top">
        <span id="speaker" class="speaker">旁白</span>
        <span class="hint">点击对话框继续</span>
      </div>
      <div id="content" class="content"></div>

      <div id="choices" class="choices hidden"></div>
    </div>

    <!-- 右上角错误提示（仅调试） -->
    <div id="errorToast" class="error-toast hidden"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>心动之箭：末日铁拳</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 背景 -->
    <div class="bg" id="bg" aria-hidden="true"></div>

    <!-- 立绘层 -->
    <div class="char-layer" aria-hidden="true">
      <img id="charImg" class="char-img" src="assets/charA.png" alt="" />
    </div>

    <!-- 顶部按钮（聊天/信件/RESET） -->
    <div class="hud">
      <button id="btnChat" class="hud-btn is-active">聊天</button>
      <button id="btnMail" class="hud-btn">信件 <span id="mailBadge" class="badge hidden">0</span></button>
      <button id="btnReset" class="hud-btn">RESET</button>
    </div>

    <!-- 左下角好感度 -->
    <div class="affection">
      <div class="aff-bar">
        <div id="affFill" class="aff-fill"></div>
      </div>
      <div class="aff-text">好感度 <span id="affValue">0</span></div>
    </div>

    <!-- 信件面板（可先空着，后面你再做UI图也行） -->
    <div id="mailPanel" class="modal hidden" role="dialog" aria-label="信件">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">信件</div>
          <button id="btnCloseMail" class="modal-close">×</button>
        </div>
        <div id="mailList" class="modal-body">
          <div class="muted">暂无信件（后面可接入 story.json 的邮件系统）</div>
        </div>
      </div>
    </div>

    <!-- 选项（显示在对话框上方一行） -->
    <div id="choices" class="choices hidden"></div>

    <!-- 对话框（底部，不超过屏幕1/3；点击继续） -->
    <div id="textbox" class="textbox">
      <div class="tb-top">
        <div id="speaker" class="speaker">旁白</div>
        <div id="hint" class="hint">点击对话框继续</div>
      </div>
      <div id="text" class="text"></div>
    </div>

  </div>

<script>
  document.body.insertAdjacentHTML("beforeend",
    "<div style='position:fixed;top:8px;left:8px;z-index:99999;background:rgba(0,0,0,.6);color:#fff;padding:6px 10px;border-radius:10px;font-size:12px;'>INLINE OK</div>"
  );
</script>
<script src="main.js?v=20251230-1"></script>
</body>
</html>
